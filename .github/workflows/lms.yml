name: LMS sync (과제·공지 → data/lms.json)

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 (UTC 기준)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lms-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch LMS data
        env:
          LMS_BASE_URL: ${{ secrets.LMS_BASE_URL }}
          LMS_TOKEN: ${{ secrets.LMS_TOKEN }}
          LMS_ICS_URL: ${{ secrets.LMS_ICS_URL }}
        run: node scripts/lms-fetch.mjs
      - name: Commit if changed
        run: |
          git config user.name "lms-bot"
          git config user.email "lms-bot@users.noreply.github.com"
          git add data/lms.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "lms: update data/lms.json"
          git pull --rebase origin main || true
          git push
